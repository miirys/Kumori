name: Kumori
options:
  bundleIdPrefix: app.kumori
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Project-wide: the test bundle rebuilds the OpenSSL module when it imports the app.
    # The same settings as OpenNOW's tvOS project, which builds the same native receiver.
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - $(BUILT_PRODUCTS_DIR)/OpenSSL.framework/Headers
      - $(BUILT_PRODUCTS_DIR)/XCFrameworkIntermediates/OpenSSL/OpenSSL.framework/Headers
    OTHER_CFLAGS:
      - $(inherited)
      - -Wno-incomplete-umbrella
packages:
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework
    revision: d972326fbabfa61c527e4774ed41bf83d3b8af09
targets:
  Kumori:
    type: application
    platform: tvOS
    sources:
      - path: Kumori
        excludes:
          - NVST/README.md
          - NVST/LICENSE
          - NVST/UPSTREAM.json
          - NVST/Licenses
    dependencies:
      - package: LiveKitWebRTC
      # The native receiver's TLS, SRTP and DTLS (OpenSSL) and SCTP (usrsctp), built for
      # tvOS by scripts/build-nvst-libs.py. Static, so nothing is embedded.
      - framework: Frameworks/OpenSSL.xcframework
        embed: false
      - framework: Frameworks/usrsctp.xcframework
        embed: false
    info:
      path: Kumori/Info.plist
      properties:
        CFBundleDisplayName: Kumori
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Night
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        ITSAppUsesNonExemptEncryption: false
        # Kumori Link: controllers relayed from an Android box on the home network.
        NSLocalNetworkUsageDescription: Kumori finds Kumori Link on your network to use its controllers.
        NSBonjourServices:
          - _kumorilink._udp
        # The commit this build came from, shown in About. CI passes KUMORI_COMMIT.
        KumoriCommit: $(KUMORI_COMMIT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kumori.tv
        MARKETING_VERSION: 1.3.0
        # The build number follows the version: 1.2.3 is 10203. CI works it out from
        # MARKETING_VERSION, so only that line needs changing for a release.
        CURRENT_PROJECT_VERSION: 10000
        KUMORI_COMMIT: dev
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ENABLE_USER_SCRIPT_SANDBOXING: false
        GENERATE_INFOPLIST_FILE: false
  # Debug-only tests for the design system and fixture harness (T01, D01-D06). The launch
  # thread's SwiftPM tests in tvos/Tests and tvos/Package.swift are separate and not listed here.
  KumoriTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - KumoriTests
    dependencies:
      - target: Kumori
      - framework: Frameworks/usrsctp.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kumori.tv.tests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_VERSION: "5.9"
  KumoriUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - KumoriUITests
    dependencies:
      - target: Kumori
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kumori.tv.uitests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: Kumori
schemes:
  Kumori:
    build:
      targets:
        Kumori: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - KumoriTests
        - KumoriUITests
    archive:
      config: Release
