name: Apple TV

on:
  push:
    paths:
      - "tvos/**"
      - ".github/workflows/tvos.yml"
  pull_request:
    paths:
      - "tvos/**"
  workflow_dispatch:
  workflow_call:

# Without this, a call from Release would hand this job the caller's write token.
permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build
        run: |
          xcodebuild \
            -project Kumori.xcodeproj \
            -scheme Kumori \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          test -f build/Build/Products/Release-appletvos/Kumori.app/Kumori

      - name: Errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -100
          tail -30 build.log

      - name: Package
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION: *//p' project.yml)
          mkdir Payload
          cp -R build/Build/Products/Release-appletvos/Kumori.app Payload/
          zip -qry "Kumori-$version-tvos-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: kumori-tvos
          path: tvos/Kumori-*.ipa
          if-no-files-found: error
