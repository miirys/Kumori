name: Apple TV

on:
  push:
    paths:
      - "tvos/**"
      - ".github/workflows/tvos.yml"
  pull_request:
    paths:
      - "tvos/**"
  workflow_dispatch:
  workflow_call:

# Without this, a call from Release would hand this job the caller's write token.
permissions:
  contents: read

jobs:
  launch-tests:
    name: Launch logic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show Swift
        run: swift --version
      - name: Test
        run: swift test

  build:
    name: Build IPA
    # Liquid Glass needs the tvOS 26 SDK or later, which comes with Xcode 26.
    runs-on: macos-26
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build
        run: |
          # The build number follows the version (1.2.3 becomes 10203), so every release
          # has a higher one than the last.
          version=$(sed -n 's/.*MARKETING_VERSION: *//p' project.yml)
          number=$(echo "$version" | awk -F. '{ print $1 * 10000 + $2 * 100 + $3 }')
          xcodebuild \
            -project Kumori.xcodeproj \
            -scheme Kumori \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$number" \
            KUMORI_COMMIT="${GITHUB_SHA::7}" \
            build > build.log 2>&1
          test -f build/Build/Products/Release-appletvos/Kumori.app/Kumori

      - name: Errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -100
          tail -30 build.log

      - name: Package
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION: *//p' project.yml)
          mkdir Payload
          cp -R build/Build/Products/Release-appletvos/Kumori.app Payload/
          zip -qry "Kumori-$version-tvos-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: kumori-tvos
          path: tvos/Kumori-*.ipa
          if-no-files-found: error
