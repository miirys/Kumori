name: Apple TV

on:
  # Pull requests run it; pushes only on main, so a PR branch doesn't build twice.
  push:
    branches: [main]
    paths:
      - "tvos/**"
      - ".github/workflows/tvos.yml"
  pull_request:
    paths:
      - "tvos/**"
  workflow_dispatch:
  workflow_call:

# Without this, a call from Release would hand this job the caller's write token.
permissions:
  contents: read

# A newer push to the same pull request replaces a build still running. When Release calls
# this workflow, github.workflow is "Release", so it gets a group of its own.
concurrency:
  group: ${{ github.workflow }}-tvos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-tests:
    name: Launch logic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show Swift
        run: swift --version
      - name: Test
        run: swift test

  build:
    name: Build IPA
    # Liquid Glass needs the tvOS 26 SDK or later, which comes with Xcode 26.
    runs-on: macos-26
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos

      - name: Cache native stream libraries
        id: nvst-libs
        uses: actions/cache@v4
        with:
          path: tvos/Frameworks
          key: nvst-libs-tvos-${{ hashFiles('tvos/scripts/build-nvst-libs.py') }}

      - name: Build native stream libraries
        if: steps.nvst-libs.outputs.cache-hit != 'true'
        run: |
          # OpenSSL and usrsctp for tvOS, for the native receiver (see scripts/build-nvst-libs.py).
          command -v cmake || brew install cmake
          python3 scripts/build-nvst-libs.py
          ls Frameworks

      - name: Generate project
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install xcodegen
          xcodegen

      - name: Build
        run: |
          # The build number follows the version (1.2.3 becomes 10203), so every release
          # has a higher one than the last.
          version=$(sed -n 's/.*MARKETING_VERSION: *//p' project.yml)
          number=$(echo "$version" | awk -F. '{ print $1 * 10000 + $2 * 100 + $3 }')
          xcodebuild \
            -project Kumori.xcodeproj \
            -scheme Kumori \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$number" \
            KUMORI_COMMIT="${GITHUB_SHA::7}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build > build.log 2>&1
          test -f build/Build/Products/Release-appletvos/Kumori.app/Kumori

      - name: Release build contains no fixtures
        run: |
          if strings build/Build/Products/Release-appletvos/Kumori.app/Kumori | grep -E "FixtureRoot|CatalogueFixtures|FixtureConfig"; then
            echo "::error::Fixture code made it into the Release binary"
            exit 1
          fi
          echo "Release binary has no fixture code."

      - name: Errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -100
          tail -30 build.log

      - name: Package
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION: *//p' project.yml)
          mkdir Payload
          cp -R build/Build/Products/Release-appletvos/Kumori.app Payload/
          zip -qry "Kumori-$version-tvos-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: kumori-tvos
          path: tvos/Kumori-*.ipa
          if-no-files-found: error
