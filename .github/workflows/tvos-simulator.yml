name: Apple TV Simulator

# Builds a Debug app for the tvOS Simulator, runs the design-system unit tests and the
# remote-driven UI tests against the fixture screens, and uploads every screenshot.
# The device IPA is built by tvos.yml, which also checks that Release has no fixture
# code; this job never signs or ships anything.

on:
  # Pull requests run it; pushes only on main, so a PR branch doesn't run it twice.
  push:
    branches: [main]
    paths:
      - "tvos/**"
      - ".github/workflows/tvos-simulator.yml"
  pull_request:
    paths:
      - "tvos/**"
      - ".github/workflows/tvos-simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Fixtures, focus tests and screenshots
    # Apple silicon: the pinned WebRTC framework ships an arm64-only tvOS Simulator slice.
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pick the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Metal toolchain
        # Settings' background is a Metal shader. Xcode 26 ships the Metal compiler as a
        # separate component; fetch it only when this runner doesn't have it.
        run: |
          if xcrun metal -v >/dev/null 2>&1; then echo "Metal toolchain present"; else xcodebuild -downloadComponent MetalToolchain; xcrun metal -v; fi

      - name: Cache native stream libraries
        id: nvst-libs
        uses: actions/cache@v4
        with:
          path: tvos/Frameworks
          key: nvst-libs-tvos-${{ hashFiles('tvos/scripts/build-nvst-libs.py') }}

      - name: Build native stream libraries
        if: steps.nvst-libs.outputs.cache-hit != 'true'
        run: |
          # OpenSSL and usrsctp for tvOS, for the native receiver (see scripts/build-nvst-libs.py).
          command -v cmake || brew install cmake
          python3 scripts/build-nvst-libs.py
          ls Frameworks

      - name: Generate project
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install xcodegen
          xcodegen

      - name: Find a tvOS simulator
        id: sim
        run: |
          udid=$(scripts/find-simulator.sh)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Unit and UI tests
        env:
          # xcodebuild hands TEST_RUNNER_* variables to the test runner without the prefix.
          TEST_RUNNER_KUMORI_CAPTURE_DIR: ${{ github.workspace }}/tvos/captures
        run: |
          mkdir -p captures
          set -o pipefail
          xcodebuild test \
            -project Kumori.xcodeproj \
            -scheme Kumori \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-sim \
            -resultBundlePath results.xcresult \
            > test.log 2>&1

      - name: Test summary
        if: always()
        run: |
          grep -E "Test Case .* (passed|failed)|error:|Executed [0-9]+ test" test.log | sort -u | tail -80 || true
          tail -20 test.log || true

      - name: Screenshots from the result bundle
        # The UI tests also write PNGs directly; this recovers them if that path was not writable.
        if: always()
        run: |
          if [ -z "$(ls captures 2>/dev/null)" ] && [ -d results.xcresult ]; then
            xcrun xcresulttool export attachments --path results.xcresult --output-path attachments || true
            if [ -f attachments/manifest.json ]; then
              python3 - <<'PY'
          import json, os, shutil
          for test in json.load(open("attachments/manifest.json")):
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  base = name.split("_")[0] if name.endswith(".png") else name
                  shutil.copy(os.path.join("attachments", a["exportedFileName"]), os.path.join("captures", base if base.endswith(".png") else base + ".png"))
          PY
            fi
          fi
          ls -la captures || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kumori-tvos-captures
          path: tvos/captures/*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kumori-tvos-test-results
          path: |
            tvos/test.log
            tvos/results.xcresult
