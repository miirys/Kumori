name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.0.0
        required: true

permissions:
  contents: write

jobs:
  android:
    uses: ./.github/workflows/android.yml

  tvos:
    uses: ./.github/workflows/tvos.yml

  publish:
    name: Publish
    needs: [android, tvos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Kumori $VERSION" \
            --notes-file "docs/release-$VERSION.md"
