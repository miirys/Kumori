name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.0.0
        required: true
      apps:
        description: Which apps to build and attach
        type: choice
        default: all
        options:
          - all
          - tvos
          - tvos-and-link

permissions:
  contents: write

jobs:
  check:
    name: Check versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The tag comes from the typed version, but the file names and the version each app
      # shows come from the source. Stop before building if they disagree.
      - name: Compare with the source
        env:
          VERSION: ${{ inputs.version }}
          APPS: ${{ inputs.apps }}
        run: |
          android=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          link=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/link/build.gradle.kts)
          tvos=$(sed -n 's/.*MARKETING_VERSION: *//p' tvos/project.yml | tr -d "\"' ")
          desktop=$(sed -n 's/^  "version": "\(.*\)",/\1/p' desktop/package.json)
          fail=0
          # An Apple TV release (with or without Kumori Link, which keeps its own version
          # numbers) leaves the Android and desktop versions alone.
          if [ "$APPS" = "all" ]; then
            [ "$desktop" = "$VERSION" ] || { echo "::error::desktop/package.json has version $desktop, not $VERSION"; fail=1; }
            [ "$android" = "$VERSION" ] || { echo "::error::android/app/build.gradle.kts has versionName $android, not $VERSION"; fail=1; }
          fi
          [ "$tvos" = "$VERSION" ] || { echo "::error::tvos/project.yml has MARKETING_VERSION $tvos, not $VERSION"; fail=1; }
          [ -f "docs/release-$VERSION.md" ] || { echo "::error::docs/release-$VERSION.md is missing"; fail=1; }
          # The notes name the Link file, so they must match the Link's own version.
          if [ "$APPS" = "tvos-and-link" ]; then
            grep -q "KumoriLink-$link.apk" "docs/release-$VERSION.md" || { echo "::error::docs/release-$VERSION.md doesn't name KumoriLink-$link.apk"; fail=1; }
          fi
          exit $fail

  android:
    needs: check
    if: inputs.apps != 'tvos'
    uses: ./.github/workflows/android.yml
    with:
      link-only: ${{ inputs.apps == 'tvos-and-link' }}

  tvos:
    needs: check
    uses: ./.github/workflows/tvos.yml

  desktop:
    needs: check
    if: inputs.apps == 'all'
    uses: ./.github/workflows/desktop.yml

  publish:
    name: Publish
    needs: [android, tvos, desktop]
    # Run when the skipped jobs were skipped on purpose, but never after a failure.
    if: ${{ !cancelled() && !failure() && needs.tvos.result == 'success' && (inputs.apps != 'tvos-and-link' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Kumori $VERSION" \
            --notes-file "docs/release-$VERSION.md"
